<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <script>try{var d=document.documentElement,t=localStorage.getItem('theme');d.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(localStorage.getItem('lang')==='ne'){d.lang='ne';d.classList.add('i18n-pending');setTimeout(function(){d.classList.remove('i18n-pending')},2500)}}catch(e){}</script>
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b2c5f">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RSJJYC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=17">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="topbar"><div class="in">
    <a class="brand" href="admin.html" title="Admin dashboard"><img src="logo.png" alt="" class="org-logo"><div><b class="org-short">RSJJYC</b><small class="org-full">Royal Star Jan Jyoti Youth Club</small></div></a>
    <span class="sp"></span>
    <span id="modePill" class="demo-pill" hidden>DEMO MODE</span>
    <button id="logout" class="btn btn-sm btn-ghost">Log out</button>
  </div></div>
  <main class="wrap">
    <div class="admin-top">
      <div class="gsearch">
        <span class="gs-ico">🔍</span>
        <input id="gSearch" type="search" placeholder="Search members by name, username, phone or member no." autocomplete="off">
        <div class="gs-results" id="gResults" hidden></div>
      </div>
      <button class="btn btn-green" id="xlsBtn">⬇ Download Excel</button>
    </div>
    <nav class="side-nav" id="nav">
      <button class="on" data-view="overview">📊 Overview</button>
      <button data-view="members">👥 Members</button>
      <button data-view="approvals">✅ Approvals <span class="badge" id="apBadge" hidden>0</span></button>
      <button data-view="payments">💰 Payments</button>
      <button data-view="reminders">🔔 Reminders <span class="badge" id="rmBadge" hidden>0</span></button>
    </nav>
    <div id="view"><div class="spinner"></div></div>
  </main>
  <footer class="site">© <span class="org-full">Royal Star Jan Jyoti Youth Club</span> · Estd. 1979</footer>
  <script type="module" src="admin.js?v=17"></script>
</body>
</html>
